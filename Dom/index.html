<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <header class="header">
        <nav class="nav container">
            <h1 class="logo">Website</h1>
            <ul class="nav-items">
                <li><a href="">Home</a></li>
                <li><a href="">Todo</a></li>
                <li><a href="">Sign up</a></li>
            </ul>
        </nav>
        <div class="headline">
            <h2>Manage Your Work</h2>
            <button class="btn btn-headline">Lern More</button>
        </div>
    </header>
    <section class="section-todo  ">
        <h2>Whats your plan for Today ?</h2>
        <form action="" class="form-todo">
            <input type="text" placeholder="Add Your Task...">
            <input type="submit" value="Add Todo" class="btn">

        </form>
    </section>
    <section class="section-signup">
        <h2>Sign up</h2>
        <form action="" class="form-signup">
            <div class="form-group">
                 <label for="username">UserName</label>
                 <input type="text" id="username" name="username" >
            </div>
              <div class="form-group">
                 <label for="password">Password</label>
                 <input type="password" id="password" name="password" >
            </div>
                <div class="form-group">
                 <label for="confirmPassword"> Confirm Password</label>
                 <input type="confirmPassword" id="confirmPassword" name="confirmPassword" >
            </div>
                <div class="form-group">
                 <label for="phone">Phone</label>
                 <input type="phone" id="phone" name="phone" >
            </div>
                <div class="form-group">
                 <label for="password">Password</label>
                 <input type="password" id="password" name="password" >
            </div>
                <div class="form-group">
                 <label for="email">Email</label>
                 <input type="email" id="email" name="email" >
            </div>
                <div class="form-group">
                 <label for="about">About Yourself</label>
                 <textarea rows="10" name="about" id="about"></textarea>
            </div>
            <input type="submit" value="Submit" class=" btn-submit">


           
        </form>
    </section>
    
</body>
</html>
